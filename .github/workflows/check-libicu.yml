name: Check for New libicu

on:
  workflow_dispatch:

  schedule:
    # 1st and 15th of every month, at midnight UTC
    - cron: '0 0 1,15 * *'

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Find latest libicu version
      # ---------------------------------------------------------
      - name: Find latest libicu version
        id: libicu
        run: |
          set -e

          VERSION=$(
            curl -fsSL \
              https://grimler.se/termux-main/pool/main/libi/libicu/ \
              | grep -oP 'libicu_\K[0-9.]+(?=_aarch64\.deb)' \
              | sort -V \
              | tail -n1
          )

          if [ -z "$VERSION" ]; then
            echo "Could not determine latest libicu version."
            exit 1
          fi

          echo "Latest libicu: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Check whether libicu release already exists
      # ---------------------------------------------------------
      - name: Check libicu release
        id: libicu_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="libicu-v${{ steps.libicu.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "libicu release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "libicu release $TAG does not exist."
          fi

      # ---------------------------------------------------------
      # Trigger libicu build when necessary
      # ---------------------------------------------------------
      - name: Trigger libicu build
        if: steps.libicu_release.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build-libicu.yml",
              ref: context.ref.replace("refs/heads/", ""),
              inputs: {
                version: "${{ steps.libicu.outputs.version }}"
              }
            });

      # ---------------------------------------------------------
      # Summary
      # ---------------------------------------------------------
      - name: Summary
        run: |
          echo "Latest libicu: ${{ steps.libicu.outputs.version }}"
          echo "libicu release exists: ${{ steps.libicu_release.outputs.exists }}"
